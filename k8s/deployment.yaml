apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-service

  template:
    metadata:
      labels:
        app: student-service

    spec:
      containers:
        - name: student-service
          image: hamjathali/student-service:latest

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: student-secret
                  key: POSTGRES_DB

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: student-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-secret
                  key: POSTGRES_PASSWORD