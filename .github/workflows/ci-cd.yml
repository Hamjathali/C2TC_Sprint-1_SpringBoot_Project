name: Student Service CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# =========================================================
# Permissions
# =========================================================
permissions:
  contents: read
  packages: write


jobs:

  # =========================================================
  # CI - Build and Test
  # =========================================================
  build-test:

    name: Build and Test
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:

      # -----------------------------------------------------
      # Checkout source code
      # -----------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Java 17
      # -----------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -----------------------------------------------------
      # Start required infrastructure
      # -----------------------------------------------------
      - name: Start Infrastructure
        run: |
          docker compose up -d db zookeeper kafka kafka2 kafka3 redis


      # -----------------------------------------------------
      # Check infrastructure
      # -----------------------------------------------------
      - name: Check Infrastructure
        run: |
          docker compose ps


      # -----------------------------------------------------
      # Wait for PostgreSQL
      # -----------------------------------------------------
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do

            if docker compose exec -T db \
              pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB"; then

              echo "PostgreSQL is ready!"
              break
            fi

            echo "PostgreSQL is not ready yet..."
            sleep 2

          done


      # -----------------------------------------------------
      # Verify PostgreSQL
      # -----------------------------------------------------
      - name: Verify PostgreSQL
        run: |
          docker compose exec -T db \
            pg_isready \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB"


      # -----------------------------------------------------
      # Maven wrapper permission
      # -----------------------------------------------------
      - name: Make Maven Wrapper Executable
        run: |
          chmod +x mvnw


      # -----------------------------------------------------
      # Run Maven Tests
      # -----------------------------------------------------
      - name: Run Maven Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433

          KAFKA_BOOTSTRAP_SERVERS: localhost:9092,localhost:9093,localhost:9094

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

        run: |
          ./mvnw clean test


      # -----------------------------------------------------
      # Build JAR
      # -----------------------------------------------------
      - name: Build JAR
        env:
          DB_HOST: localhost
          DB_PORT: 5433

          KAFKA_BOOTSTRAP_SERVERS: localhost:9092,localhost:9093,localhost:9094

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

        run: |
          ./mvnw package -DskipTests


      # -----------------------------------------------------
      # Verify JAR
      # -----------------------------------------------------
      - name: Verify JAR
        run: |
          ls -lh target/


      # -----------------------------------------------------
      # Stop Infrastructure
      # -----------------------------------------------------
      - name: Stop Infrastructure
        if: always()
        run: |
          docker compose down



  # =========================================================
  # CD - Build and Push Image to GHCR
  # =========================================================
  docker:

    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest

    needs: build-test

    steps:

      # -----------------------------------------------------
      # Checkout source code
      # -----------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Java 17
      # -----------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -----------------------------------------------------
      # Maven wrapper permission
      # -----------------------------------------------------
      - name: Make Maven Wrapper Executable
        run: |
          chmod +x mvnw


      # -----------------------------------------------------
      # Build JAR for Docker Image
      # -----------------------------------------------------
      - name: Build JAR
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

        run: |
          ./mvnw package -DskipTests


      # -----------------------------------------------------
      # Verify JAR
      # -----------------------------------------------------
      - name: Verify JAR
        run: |
          ls -lh target/


      # -----------------------------------------------------
      # Convert repository owner to lowercase
      # GHCR image names must be lowercase
      # -----------------------------------------------------
      - name: Set GHCR Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/student-service" >> $GITHUB_ENV


      # -----------------------------------------------------
      # Login to GHCR
      # Uses built-in GitHub Token
      # No separate GitHub token secret required
      # -----------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------
      # Setup Docker Buildx
      # -----------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------
      # Build and Push Docker Image to GHCR
      # -----------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


      # -----------------------------------------------------
      # Image information
      # -----------------------------------------------------
      - name: Show Image
        run: |
          echo "======================================"
          echo "Docker image pushed successfully!"
          echo "Image: ${{ env.IMAGE_NAME }}:latest"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "======================================"



 